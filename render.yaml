# Blueprint Render pentru API.
# Render Dashboard → New → Blueprint → alege repo-ul FilipObrijan/teza.
# Baza de date e pe Neon (gratuit, nu expiră); site-ul e pe Cloudflare Pages.
services:
  - type: web
    name: agrohub-api
    runtime: node
    plan: free
    # --include=dev: cu NODE_ENV=production npm ar sări peste typescript, necesar la build.
    buildCommand: npm ci --include=dev && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string-ul de la Neon (Dashboard → Connect).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Adresele site-ului, separate prin virgulă, ex. "https://agrohub.pages.dev,https://agrohub.md".
      - key: CORS_ORIGIN
        sync: false
      # Adresa site-ului folosită în linkurile din emailuri, ex. "https://agrohub.pages.dev/".
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Emailurile se trimit prin API-ul Brevo (Render free blochează porturile SMTP).
      - key: BREVO_API_KEY
        sync: false
      # Adresa de expeditor, verificată în Brevo.
      - key: SMTP_FROM
        sync: false
      # Client ID-ul OAuth din Google Cloud, pentru „Continuă cu Google” (același ca VITE_GOOGLE_CLIENT_ID pe Cloudflare).
      - key: GOOGLE_CLIENT_ID
        sync: false
